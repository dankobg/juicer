x-logging: &dev-logging
  driver: "json-file"
  options:
    max-file: "5"
    max-size: "10M"
    tag: "{{.ImageName}}|{{.Name}}|{{.ImageFullID}}|{{.FullID}}"

x-healthcheck: &dev-healthcheck
  interval: 30s
  timeout: 5s
  retries: 5
  start_interval: 200ms
  start_period: 10s

services:
  # ----------------------------------------------------------------------------
  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    networks:
      - devproxy
    env_file:
      - .env
    environment:
      - VITE_PUBLIC_VITE_NETWORK=${VITE_PUBLIC_VITE_NETWORK:-host.docker.internal}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy-sites:/etc/caddy/sites
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      - host.docker.internal:host-gateway
    logging: *dev-logging
    healthcheck:
      <<: *dev-healthcheck
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://host.docker.internal:80/health-check-caddy",
        ]
  # ----------------------------------------------------------------------------
  # traefik:
  #   image: traefik:v3.2
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #     - "8080:8080"
